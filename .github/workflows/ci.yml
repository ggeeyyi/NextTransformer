name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # a full run: every suite and every test, whatever changed

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.event_name == 'workflow_dispatch' || steps.python.outputs.python == 'true' }}
      gym: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.gym == 'true' }}
      audit: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.audit == 'true' }}
      audit_full: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.audit_full == 'true' }}
      ddp: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.ddp == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A push is compared with the last commit whose checks passed on its branch, so the changes of a
      # cancelled or failed run are still tested. Pull requests are compared with their base.
      - id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$GITHUB_REF_NAME" \
                --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ] || ! git cat-file -e "$sha^{commit}" 2>/dev/null; then sha="${{ github.event.before }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Python tests also read the root and docs/ Markdown files; only website-only changes skip them.
      - uses: dorny/paths-filter@v3
        id: python
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: every
          filters: |
            python:
              - '**'
              - '!website/**'
      - uses: dorny/paths-filter@v3
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            workflow: &workflow
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            gym:
              - *workflow
              - 'nextt_gym/**'
              - 'nexttransformer/**'
              - 'nanochat/**'
              - 'configs/**'
              - 'evidence/**'
              - 'results/**'
            # Representative audit reproductions: anything that can change an audited cost.
            audit:
              - *workflow
              - 'nextt_gym/audit.py'
              - 'nextt_gym/contract.py'
              - 'nextt_gym/upstream_model.py'
              - 'nextt_gym/task.py'
              - 'nextt_gym/importer.py'
              - 'nextt_gym/tests/test_foundations.py'
              - 'nexttransformer/protocol/**'
              - 'nexttransformer/models/**'
              - 'nexttransformer/methods/**'
              - 'nanochat/**'
              - 'configs/**'
              - 'evidence/costs/**'
            # Every method's reproduction: the audit implementation itself changed.
            audit_full:
              - *workflow
              - 'nextt_gym/audit.py'
              - 'nextt_gym/contract.py'
              - 'nextt_gym/upstream_model.py'
              - 'nexttransformer/protocol/compute.py'
              - 'nexttransformer/protocol/spec.py'
            ddp:
              - *workflow
              - 'nexttransformer/train.py'
              - 'nexttransformer/training/**'
              - 'nexttransformer/runtime/**'
              - 'nexttransformer/protocol/**'
              - 'nexttransformer/evaluation/**'
              - 'nexttransformer/models/**'
              - 'nanochat/**'
              - 'tests/test_data_layout.py'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      NANOCHAT_DTYPE: float32
      TORCH_COMPILE_DISABLE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra cpu
      - run: uv run python -m nexttransformer.export_run --check
      - run: uv run python -m nexttransformer.arena --check
      - env:
          MARKS: ${{ needs.changes.outputs.ddp == 'true' && 'all' || 'not ddp' }}
        run: |
          if [ "$MARKS" = all ]; then set --; else set -- -m "$MARKS"; fi
          uv run python -m pytest -q -n auto "$@"

  gym:
    needs: changes
    if: needs.changes.outputs.gym == 'true'
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      NANOCHAT_DTYPE: float32
      TORCH_COMPILE_DISABLE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra cpu --group dev
      - run: uv pip install --python .venv/bin/python -r nextt_gym/requirements.txt
      - env:
          MARKS: ${{ needs.changes.outputs.audit_full == 'true' && 'all' || needs.changes.outputs.audit == 'true' && 'not audit_full' || 'not audit' }}
        run: |
          if [ "$MARKS" = all ]; then set --; else set -- -m "$MARKS"; fi
          .venv/bin/python -m pytest nextt_gym/tests -q -n auto "$@"

  arena-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Applies to pull requests that add or change a card under results/arena/ or add a method plugin under
      # nexttransformer/methods/; needs no dependencies.
      - run: python3 -m nexttransformer.arena --scope origin/${{ github.base_ref }}

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit -p .
      - run: npm run build
