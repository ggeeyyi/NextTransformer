name: Result announcement
description: Announce a formal run you are training or about to submit.
labels: [result]
body:
  - type: input
    id: method
    attributes:
      label: Method id
      description: The registered method id, e.g. `hc` or `gdn_hybrid`.
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: State
      options:
        - Training
        - Finished, preparing the pull request
        - Failed or stopped (to be recorded)
    validations:
      required: true
  - type: dropdown
    id: core-truncation
    attributes:
      label: CORE input truncation
      options:
        - No truncation (full prompts)
        - Left truncation with a token limit
    validations:
      required: true
  - type: input
    id: core-max-tokens
    attributes:
      label: CORE token limit
      description: Enter none for full prompts or the exact positive integer passed to --core-max-tokens.
      placeholder: none or 2048
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Expected completion, data layout (8, 16 or 32 GPUs), resumes, and anything reviewers should know.
