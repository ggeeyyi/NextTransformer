# Native Harbor Claude Code; this fixture budget is not a production allocation.
[agent]
name = "claude-code"
model = "opus"
version = "2.1.312"
max_turns = 64
# Optional API cost limit. Remove this line to omit the limit.
max_budget_usd = "5.00"

[budget]
# One total allocation for the whole research session, including numerical checks.
research_flops_limit = "1000000000000"

[runtime]
# Optional: operator-owned GPU allocation and an existing host CUDA interpreter.
# execution_config = "gym/examples/resources.gpu.json"
# worker_python = "/path/to/cuda-environment/bin/python"
jobs_dir = ".agent-work/harbor-gym"
timeout_sec = 1800

[images]
client = "nt-gym-client:local"
verifier = "nt-gym-verifier:local"
